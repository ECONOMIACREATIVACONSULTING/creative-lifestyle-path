/* [title, expl, reflect, try] in EN then ES */
const P=[
[["Cultivate Rituals, Not Routines","Routines organise life; rituals add attention and meaning. Small repeated moments, like a slow first coffee or a morning notebook, become anchors for wellbeing and creativity.","What ritual helps you feel most present at the beginning of your day?","Turn one ordinary part of tomorrow morning into a ritual. Slow it down and give it your full attention."],["Cultiva rituales, no rutinas","Las rutinas organizan la vida; los rituales añaden atención y sentido. Pequeños momentos repetidos, como un primer café sin prisa o un cuaderno por la mañana, se convierten en anclas de bienestar y creatividad.","¿Qué ritual te ayuda a sentirte más presente al comenzar el día?","Convierte una parte ordinaria de mañana por la mañana en un ritual. Hazla más lenta y dale toda tu atención."]],
[["Remain a Curious Beginner","Becoming a beginner again takes you outside familiar patterns. Curiosity keeps you open and adds to the experience your imagination draws on.","What could you begin today simply for the joy of learning?","Spend 20 minutes learning something you know nothing about. Don't aim to become good at it. Just begin."],["Sigue siendo un principiante curioso","Volver a ser principiante te saca de los patrones conocidos. La curiosidad te mantiene abierto y amplía la experiencia de la que se nutre tu imaginación.","¿Qué podrías empezar hoy solo por el placer de aprender?","Dedica 20 minutos a aprender algo que no conoces. No busques hacerlo bien. Simplemente empieza."]],
[["Curate an Environment for the Senses","The places we inhabit shape how we think. Light, objects, textures and smells affect attention. Beauty need not be expensive; thoughtful simplicity is enough.","Which space makes you feel most awake to your surroundings?","Take one space you use daily. Remove one source of noise, reposition one thing that matters, or add one sensory detail (texture, scent, sound, natural light). Notice what changes."],["Cura un entorno para los sentidos","Los lugares que habitamos moldean cómo pensamos. La luz, los objetos, las texturas y los olores afectan a la atención. La belleza no tiene por qué ser cara; basta una sencillez cuidada.","¿Qué espacio te hace sentir más despierto a lo que te rodea?","Toma un espacio que uses a diario. Retira algo que genere ruido, recoloca algo importante o añade un detalle sensorial (textura, aroma, sonido, luz natural). Observa qué cambia."]],
[["Protect Your Attention","Attention is one of our most valuable creative resources. Protecting it is not about disconnecting from the world, but about choosing consciously where your energy goes.","What deserves more of your attention, and what deserves less?","Put your phone away for 30 minutes today. Use the time to walk, read, observe or simply think."],["Protege tu atención","La atención es uno de nuestros recursos creativos más valiosos. Protegerla no es desconectar del mundo, sino elegir conscientemente adónde va tu energía.","¿Qué merece más de tu atención y qué merece menos?","Aparta el móvil 30 minutos hoy. Usa ese tiempo para caminar, leer, observar o simplemente pensar."]],
[["Let Nature Reset Your Perception","Time in nature slows the mind and sharpens the senses. Nature has its own seasons of growth and rest, and invites us to notice rather than produce.","When was the last time nature changed the way you were thinking?","Step outside for 20 minutes without headphones (a trail, street, courtyard or open window). Notice five living or changing things you would normally overlook. If possible, leave with one small act of care."],["Deja que la naturaleza renueve tu percepción","El tiempo en la naturaleza ralentiza la mente y agudiza los sentidos. Tiene sus propias estaciones de crecimiento y descanso, y nos invita a notar en lugar de producir.","¿Cuándo fue la última vez que la naturaleza cambió tu forma de pensar?","Sal 20 minutos sin auriculares (un sendero, una calle, un patio o una ventana abierta). Fíjate en cinco cosas vivas o cambiantes que normalmente pasarías por alto. Si puedes, deja el lugar con un pequeño gesto de cuidado."]],
[["Document Your Life","Collecting observations, photos, sketches and fragments builds an archive of ideas. Documenting is less about recording events than preserving the details that make them meaningful.","What moment from today would you like to remember a year from now?","Record one small detail from today (a photograph, sentence, sound, object or observation). Keep it without explaining it."],["Documenta tu vida","Reunir observaciones, fotos, bocetos y fragmentos crea un archivo de ideas. Documentar es menos registrar hechos que conservar los detalles que les dan sentido.","¿Qué momento de hoy te gustaría recordar dentro de un año?","Registra un pequeño detalle de hoy (una foto, frase, sonido, objeto u observación). Consérvalo sin explicarlo."]],
[["Learn Through Participation","Some things can only be understood by taking part: entering the room, trying, failing, and seeing how others approach the same task. You do not need to be an expert, only willing to begin.","What would you like to learn by actually taking part rather than reading or watching?","Join something this month that puts you in the room: a workshop, talk, class, guided walk or creative activity. Go as a participant, not an expert."],["Aprende participando","Algunas cosas solo se entienden participando: entrar en la sala, probar, fallar y ver cómo otros afrontan la misma tarea. No hace falta ser experto, solo querer empezar.","¿Qué te gustaría aprender participando de verdad, en lugar de leer o mirar?","Súmate este mes a algo que te ponga en la sala: un taller, charla, clase, ruta guiada o actividad creativa. Ve como participante, no como experto."]],
[["Choose Presence Over Performance","Not every beautiful moment needs an audience. The question is whether documenting serves the experience or replaces it. Presence is not doing less; it is experiencing more.","Which moments in your life deserve to exist only for you?","Have one meal, walk or conversation today without taking a photograph or checking your phone."],["Elige la presencia sobre la actuación","No todo momento hermoso necesita público. La cuestión es si documentar sirve a la experiencia o la sustituye. Presencia no es hacer menos, sino vivir más.","¿Qué momentos de tu vida merecen existir solo para ti?","Haz hoy una comida, un paseo o una conversación sin hacer fotos ni mirar el móvil."]],
[["Seek Meaningful Encounters","Creativity grows through human connection. Seek conversations that challenge your perspective rather than confirm it, and listen deeply.","Whose perspective could help you see a familiar question differently, and how might you enter that conversation with genuine curiosity?","Ask someone a question you genuinely don't know the answer to, and listen without planning your reply."],["Busca encuentros significativos","La creatividad crece con el contacto humano. Busca conversaciones que desafíen tu perspectiva en lugar de confirmarla, y escucha con atención.","¿Qué perspectiva podría ayudarte a ver de otro modo una pregunta conocida, y cómo podrías entrar en esa conversación con curiosidad genuina?","Haz a alguien una pregunta cuya respuesta realmente no conozcas y escucha sin preparar tu réplica."]],
[["Make Room for Solitude and Nothingness","Solitude creates space for clarity. It is not an escape from the world but a return to ourselves, letting experience settle and ideas take shape.","When did you last spend time alone without distraction?","Go somewhere you enjoy and spend 20 minutes alone, without your phone, music or anything to accomplish."],["Haz sitio a la soledad y al no hacer nada","La soledad crea espacio para la claridad. No es una huida del mundo sino un regreso a uno mismo, que deja asentarse la experiencia y tomar forma las ideas.","¿Cuándo fue la última vez que pasaste tiempo a solas sin distracciones?","Ve a un lugar que disfrutes y pasa 20 minutos a solas, sin móvil, música ni nada que lograr."]],
[["Create Before You Consume","Beginning the day with your own small mark (a sentence, a photograph, a note) lets you hear your own attention before other voices crowd in. It is not a productivity ritual.","How could you begin tomorrow by creating rather than consuming?","Tomorrow morning, make something before opening social media, email or the news."],["Crea antes de consumir","Empezar el día con tu propia pequeña marca (una frase, una foto, una nota) te permite oír tu atención antes de que otras voces la llenen. No es un ritual de productividad.","¿Cómo podrías empezar mañana creando en lugar de consumiendo?","Mañana por la mañana, crea algo antes de abrir redes sociales, el correo o las noticias."]],
[["Make Creativity Your Way of Living","The twelve practices are not a closed system. A creative life becomes your own through adaptation, and gains meaning when something enters a relationship: a meal offered, a story shared, a place cared for.","What does living creatively mean to you today?","Choose one of these twelve practices and bring it into your life again this week, in your own way."],["Haz de la creatividad tu forma de vivir","Las doce prácticas no son un sistema cerrado. Una vida creativa se hace tuya adaptándola, y cobra sentido cuando algo entra en una relación: una comida ofrecida, una historia compartida, un lugar cuidado.","¿Qué significa para ti hoy vivir creativamente?","Elige una de estas doce prácticas y vuelve a incorporarla esta semana, a tu manera."]]

es:{title:"Diseña tu camino de Estilo de Vida Creativo",intro:"La creatividad comienza con la manera en que prestamos atención. Basada en el Creative Lifestyle Journal (noviembre de 2026): 12 prácticas para vivir creativamente, esta herramienta te ayuda a elegir algunas prácticas y a dar forma a un camino propio, pequeño y flexible.",how:"Cómo funciona: (1) elige de una a tres de las doce prácticas, (2) reflexiona y adapta cada experimento, (3) añade tu propia decimotercera práctica y (4) obtén un resumen personal para descargar o imprimir. Unos 10 minutos. No hay línea de meta: adapta, vuelve a lo que necesites y deja a un lado lo que no.",s1:"1. Elige tus prácticas",s1h:"Lee cada práctica y elige de una a tres que te llamen. Cada una incluye una breve explicación y una pregunta para reflexionar.",s2:"2. Reflexiona y prueba",s2h:"Para cada práctica, responde a la pregunta si quieres, usa o adapta el experimento sugerido y decide cuándo podría encajar en tu vida. Mantenlo pequeño: una versión que puedas hacer vale más que un plan perfecto.",reflect:"Reflexiona",tryit:"Pruébalo",useit:"Usar este experimento tal como se sugiere",adapt:"Mi propia versión o adaptación (opcional)",answer:"Mi reflexión (opcional)",rhythm:"Mi ritmo (p. ej. una vez esta semana, cuando pueda)",support:"¿Qué apoyo, acceso o cambio me ayudaría?",s3:"3. La decimotercera práctica es tuya",s3h:"El journal termina preguntando: ¿qué práctica necesita tu vida ahora? Ponle nombre y añade algunas intenciones. Todo es opcional.",own13:"Mi decimotercera práctica (lo que mi vida necesita ahora)",notice:"¿Qué me gustaría notar más?",min:"¿Cuál sería la versión más pequeña que seguiría teniendo sentido?",rev:"¿Cuándo me gustaría revisarlo? (opcional)",name:"Nombre o seudónimo (opcional)",gen:"Crear mi camino",back:"Atrás",next:"Continuar",ferr:"Elige de una a tres prácticas.",res:"Mi camino de Estilo de Vida Creativo",resh:"Este es tu resumen personal. Descárgalo como texto o imprímelo en PDF antes de sali function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}
